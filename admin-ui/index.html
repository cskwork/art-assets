<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 교육 콘텐츠 생성기 관제 대시보드</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="orbital-backdrop" aria-hidden="true"></div>
  <div class="noise-layer" aria-hidden="true"></div>

  <div class="app-layout">
    <header class="app-header">
      <div class="header-top">
        <div class="hero-signal">
          <p class="header-kicker">콘텐츠 운영 관제실</p>
          <h1>AI 교육 콘텐츠 생성기 관제 대시보드</h1>
          <p class="header-sub">요청 생성, 작업 상태 추적, 결과 미리보기를 하나의 화면에서 처리합니다.</p>
        </div>

        <div class="header-meta">
          <div class="meta-clock">
            <strong id="opsClock">--:--:--</strong>
            <span id="opsDate">----년 --월 --일</span>
          </div>

          <div class="header-actions">
            <button class="btn-theme-toggle" id="themeToggle" type="button" aria-label="테마 전환">다크 모드</button>
            <div class="header-status" aria-live="polite">
              <div class="ws-indicator" id="wsIndicator"></div>
              <span id="wsStatusText">연결 대기</span>
            </div>
          </div>
        </div>
      </div>

      <div class="kpi-marquee" aria-hidden="true">
        <div class="kpi-track">
          <span>대기 <strong id="kpiPending">0</strong></span>
          <span>진행 <strong id="kpiProcessing">0</strong></span>
          <span>완료 <strong id="kpiCompleted">0</strong></span>
          <span>실패 <strong id="kpiFailed">0</strong></span>
          <span class="kpi-note">실시간 파이프라인 상태 반영</span>
        </div>
      </div>
    </header>

    <aside class="sidebar">
      <h2>생성 설정</h2>

      <div class="form-group">
        <label for="subjectSelect">과목</label>
        <select id="subjectSelect">
          <option value="">로딩 중...</option>
        </select>
      </div>

      <div class="form-group">
        <label for="contentTypeSelect">콘텐츠 유형</label>
        <select id="contentTypeSelect">
          <option value="">로딩 중...</option>
        </select>
      </div>

      <div class="form-group">
        <label for="gradeLevelSelect">학년</label>
        <select id="gradeLevelSelect">
          <option value="">로딩 중...</option>
        </select>
      </div>

      <div class="form-group">
        <label for="countSlider">생성 수량</label>
        <div class="count-row">
          <input type="range" id="countSlider" min="1" max="10" value="1">
          <span class="count-display" id="countDisplay">1</span>
        </div>
      </div>

      <div class="form-group">
        <label for="visualStyleSelect">비주얼 스타일</label>
        <select id="visualStyleSelect">
          <option value="">로딩 중...</option>
        </select>
        <p class="field-hint" id="visualStyleHint"></p>
      </div>

      <div class="form-group">
        <label for="storyThemeSelect">스토리 테마</label>
        <select id="storyThemeSelect">
          <option value="">로딩 중...</option>
        </select>
        <p class="field-hint" id="storyThemeHint"></p>
      </div>

      <div class="form-group">
        <label for="difficultySelect">난이도</label>
        <select id="difficultySelect">
          <option value="">로딩 중...</option>
        </select>
      </div>

      <div class="form-group">
        <label class="checkbox-group" for="useArtAssets">
          <input type="checkbox" id="useArtAssets" checked>
          아트 에셋 사용 (기본 ON)
        </label>
      </div>

      <button class="btn-generate" id="btnGenerate" disabled>교육 콘텐츠 생성 시작</button>

      <div class="stats-bar">
        <div class="stat-item">
          <div class="stat-value pending" id="statPending">0</div>
          <div class="stat-label">대기</div>
        </div>
        <div class="stat-item">
          <div class="stat-value processing" id="statProcessing">0</div>
          <div class="stat-label">진행</div>
        </div>
        <div class="stat-item">
          <div class="stat-value completed" id="statCompleted">0</div>
          <div class="stat-label">완료</div>
        </div>
        <div class="stat-item">
          <div class="stat-value failed" id="statFailed">0</div>
          <div class="stat-label">실패</div>
        </div>
      </div>
    </aside>

    <main class="main-area">
      <div class="main-headline">
        <h2>작업 현황</h2>
        <p>카드를 눌러 결과를 즉시 검토하고 파이프라인 병목을 추적하세요.</p>
      </div>

      <div id="jobContainer">
        <div class="empty-state" id="emptyState">
          <div class="empty-icon">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
          </div>
          <div>아직 생성된 작업이 없습니다.</div>
          <div class="empty-caption">왼쪽 설정에서 조건을 선택하고 생성을 시작하세요.</div>
        </div>
        <div class="job-grid" id="jobGrid"></div>
      </div>
    </main>

    <section class="log-panel" aria-label="실시간 로그 영역">
      <div class="log-header">
        <span>실시간 로그</span>
        <button class="btn-clear-log" id="btnClearLog">지우기</button>
      </div>
      <div class="log-content" id="logContent"></div>
    </section>
  </div>

  <div class="modal-overlay" id="previewModal">
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="previewTitle">
      <div class="modal-header">
        <h3 id="previewTitle">콘텐츠 미리보기</h3>
        <button class="btn-close-modal" id="btnCloseModal">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          닫기
        </button>
      </div>
      <div class="modal-body">
        <iframe id="previewIframe" src="about:blank"></iframe>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
