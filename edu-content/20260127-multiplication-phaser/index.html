<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구구단 풍선 터트리기 | Multiplication Balloon Pop</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Noto Sans KR', sans-serif;
            padding: 20px;
        }
        #game-container {
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        .info {
            color: #94a3b8;
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
        }
        .info span { color: #f472b6; }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <p class="info">초등 2-3학년 수학 | <span>구구단</span> 풍선을 터트려 정답을 맞추세요</p>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
    <script>
        // ===== COLORS =====
        const COLORS = {
            bgPrimary: 0x0f172a,
            bgSecondary: 0x1e293b,
            bgCard: 0x334155,
            primary: 0x3b82f6,
            secondary: 0x6366f1,
            accent: 0x8b5cf6,
            success: 0x22c55e,
            warning: 0xf59e0b,
            error: 0xef4444,
            pink: 0xf472b6,
            cyan: 0x22d3ee,
            orange: 0xfb923c,
            lime: 0xa3e635,
            gold: 0xfbbf24,
            white: 0xffffff,
            balloonColors: [0xf472b6, 0x22d3ee, 0xa3e635, 0xfb923c, 0x8b5cf6, 0x3b82f6]
        };

        // ===== TEXT STYLES =====
        const TEXT_STYLES = {
            title: { fontFamily: 'Noto Sans KR', fontSize: '42px', color: '#ffffff', fontStyle: 'bold' },
            subtitle: { fontFamily: 'Noto Sans KR', fontSize: '24px', color: '#94a3b8' },
            body: { fontFamily: 'Noto Sans KR', fontSize: '20px', color: '#e2e8f0', wordWrap: { width: 700 }, lineSpacing: 8 },
            button: { fontFamily: 'Noto Sans KR', fontSize: '24px', color: '#ffffff', fontStyle: 'bold' },
            label: { fontFamily: 'Noto Sans KR', fontSize: '16px', color: '#94a3b8' },
            problem: { fontFamily: 'Noto Sans KR', fontSize: '48px', color: '#ffffff', fontStyle: 'bold' },
            balloonNum: { fontFamily: 'Noto Sans KR', fontSize: '32px', color: '#ffffff', fontStyle: 'bold' }
        };

        // ===== GAME DATA =====
        const GAME_DATA = {
            rounds: [
                { name: '쉬움', tables: [2, 3, 4, 5], color: COLORS.lime },
                { name: '보통', tables: [6, 7], color: COLORS.orange },
                { name: '어려움', tables: [8, 9], color: COLORS.pink }
            ],
            problemsPerRound: 5
        };

        // ===== ICON DRAWING FUNCTIONS =====
        const Icons = {
            drawStar(graphics, x, y, size, color = COLORS.gold) {
                graphics.fillStyle(color, 1);
                const points = [];
                for (let i = 0; i < 10; i++) {
                    const radius = i % 2 === 0 ? size : size * 0.5;
                    const angle = (i * Math.PI / 5) - Math.PI / 2;
                    points.push({ x: x + Math.cos(angle) * radius, y: y + Math.sin(angle) * radius });
                }
                graphics.beginPath();
                graphics.moveTo(points[0].x, points[0].y);
                for (let i = 1; i < points.length; i++) {
                    graphics.lineTo(points[i].x, points[i].y);
                }
                graphics.closePath();
                graphics.fillPath();
            },

            drawTrophy(graphics, x, y, size) {
                graphics.fillStyle(COLORS.gold, 1);
                graphics.fillRoundedRect(x - size * 0.4, y - size * 0.3, size * 0.8, size * 0.5, 8);
                graphics.lineStyle(4, COLORS.gold, 1);
                graphics.beginPath();
                graphics.arc(x - size * 0.5, y - size * 0.1, size * 0.15, -Math.PI / 2, Math.PI / 2, false);
                graphics.strokePath();
                graphics.beginPath();
                graphics.arc(x + size * 0.5, y - size * 0.1, size * 0.15, Math.PI / 2, -Math.PI / 2, false);
                graphics.strokePath();
                graphics.fillStyle(COLORS.gold, 1);
                graphics.fillRect(x - size * 0.15, y + size * 0.2, size * 0.3, size * 0.15);
                graphics.fillRect(x - size * 0.25, y + size * 0.35, size * 0.5, size * 0.1);
                this.drawStar(graphics, x, y - size * 0.1, size * 0.15, 0xffffff);
            },

            drawPlay(graphics, x, y, size) {
                graphics.fillStyle(COLORS.white, 1);
                graphics.beginPath();
                graphics.moveTo(x - size * 0.3, y - size * 0.4);
                graphics.lineTo(x + size * 0.4, y);
                graphics.lineTo(x - size * 0.3, y + size * 0.4);
                graphics.closePath();
                graphics.fillPath();
            },

            drawRefresh(graphics, x, y, size) {
                graphics.lineStyle(3, COLORS.white, 1);
                graphics.beginPath();
                graphics.arc(x, y, size * 0.35, -Math.PI * 0.8, Math.PI * 0.5, false);
                graphics.strokePath();
                graphics.fillStyle(COLORS.white, 1);
                graphics.beginPath();
                graphics.moveTo(x + size * 0.1, y + size * 0.35);
                graphics.lineTo(x + size * 0.35, y + size * 0.2);
                graphics.lineTo(x + size * 0.35, y + size * 0.5);
                graphics.closePath();
                graphics.fillPath();
            },

            drawHeart(graphics, x, y, size, color = COLORS.pink) {
                graphics.fillStyle(color, 1);
                const r = size * 0.25;
                graphics.fillCircle(x - r, y - r * 0.5, r);
                graphics.fillCircle(x + r, y - r * 0.5, r);
                graphics.fillTriangle(
                    x - size * 0.45, y - r * 0.3,
                    x + size * 0.45, y - r * 0.3,
                    x, y + size * 0.4
                );
            },

            drawRobot(graphics, x, y, size) {
                // Body - calculator theme
                graphics.fillStyle(0x64748b, 1);
                graphics.fillRoundedRect(x - size * 0.35, y - size * 0.1, size * 0.7, size * 0.5, 8);
                // Head
                graphics.fillStyle(0x94a3b8, 1);
                graphics.fillRoundedRect(x - size * 0.3, y - size * 0.45, size * 0.6, size * 0.35, 6);
                // Antenna
                graphics.lineStyle(3, 0x64748b, 1);
                graphics.lineBetween(x, y - size * 0.45, x, y - size * 0.6);
                graphics.fillStyle(COLORS.pink, 1);
                graphics.fillCircle(x, y - size * 0.65, size * 0.06);
                // Eyes - numbers!
                graphics.fillStyle(COLORS.cyan, 1);
                graphics.fillCircle(x - size * 0.12, y - size * 0.3, size * 0.08);
                graphics.fillCircle(x + size * 0.12, y - size * 0.3, size * 0.08);
                graphics.fillStyle(0xffffff, 1);
                graphics.fillCircle(x - size * 0.1, y - size * 0.32, size * 0.03);
                graphics.fillCircle(x + size * 0.14, y - size * 0.32, size * 0.03);
                // Mouth - display
                graphics.fillStyle(0x334155, 1);
                graphics.fillRoundedRect(x - size * 0.15, y - size * 0.15, size * 0.3, size * 0.08, 4);
                // Calculator buttons on body
                graphics.fillStyle(0x475569, 1);
                for (let r = 0; r < 2; r++) {
                    for (let c = 0; c < 3; c++) {
                        graphics.fillRoundedRect(x - size * 0.25 + c * size * 0.18, y - size * 0.02 + r * size * 0.15, size * 0.12, size * 0.1, 2);
                    }
                }
                // Arms
                graphics.fillStyle(0x64748b, 1);
                graphics.fillRoundedRect(x - size * 0.5, y - size * 0.05, size * 0.12, size * 0.3, 4);
                graphics.fillRoundedRect(x + size * 0.38, y - size * 0.05, size * 0.12, size * 0.3, 4);
                // Legs
                graphics.fillRoundedRect(x - size * 0.25, y + size * 0.4, size * 0.15, size * 0.2, 4);
                graphics.fillRoundedRect(x + size * 0.1, y + size * 0.4, size * 0.15, size * 0.2, 4);
            },

            drawBalloon(graphics, x, y, radius, color) {
                // Main balloon shape (oval)
                graphics.fillStyle(color, 1);
                graphics.fillEllipse(x, y, radius * 0.85, radius);
                // Highlight
                graphics.fillStyle(0xffffff, 0.3);
                graphics.fillEllipse(x - radius * 0.25, y - radius * 0.35, radius * 0.25, radius * 0.35);
                // Knot
                graphics.fillStyle(color, 1);
                graphics.fillTriangle(x - 8, y + radius - 5, x + 8, y + radius - 5, x, y + radius + 10);
                // String
                graphics.lineStyle(2, 0x94a3b8, 1);
                graphics.beginPath();
                graphics.moveTo(x, y + radius + 10);
                graphics.lineTo(x - 5, y + radius + 30);
                graphics.lineTo(x + 5, y + radius + 50);
                graphics.lineTo(x - 3, y + radius + 70);
                graphics.strokePath();
            },

            drawMultiply(graphics, x, y, size) {
                graphics.lineStyle(4, COLORS.gold, 1);
                graphics.lineBetween(x - size, y - size, x + size, y + size);
                graphics.lineBetween(x - size, y + size, x + size, y - size);
            },

            drawBook(graphics, x, y, size) {
                graphics.fillStyle(COLORS.pink, 1);
                graphics.fillRoundedRect(x - size * 0.4, y - size * 0.3, size * 0.8, size * 0.6, 4);
                graphics.fillStyle(0xffffff, 1);
                graphics.fillRect(x - size * 0.35, y - size * 0.25, size * 0.35, size * 0.5);
                graphics.lineStyle(1, 0xcccccc, 1);
                for (let i = 0; i < 4; i++) {
                    graphics.lineBetween(x - size * 0.3, y - size * 0.15 + i * size * 0.12, x - size * 0.05, y - size * 0.15 + i * size * 0.12);
                }
                graphics.fillStyle(0xec4899, 1);
                graphics.fillRect(x - size * 0.02, y - size * 0.3, size * 0.04, size * 0.6);
            }
        };

        // ===== HELPER: Generate multiplication problem =====
        function generateProblem(tables) {
            const a = Phaser.Utils.Array.GetRandom(tables);
            const b = Phaser.Math.Between(1, 9);
            return { a, b, answer: a * b };
        }

        // ===== HELPER: Generate wrong answers =====
        function generateWrongAnswers(correct, count) {
            const wrongs = new Set();
            while (wrongs.size < count) {
                let wrong = correct + Phaser.Math.Between(-10, 10);
                if (wrong > 0 && wrong !== correct) {
                    wrongs.add(wrong);
                }
            }
            return Array.from(wrongs);
        }

        // ===== HOOK SCENE =====
        class HookScene extends Phaser.Scene {
            constructor() { super('HookScene'); }

            create() {
                const { width, height } = this.cameras.main;
                this.add.rectangle(0, 0, width, height, COLORS.bgPrimary).setOrigin(0);

                // Floating balloons
                for (let i = 0; i < 12; i++) {
                    const balloonGfx = this.add.graphics();
                    const color = Phaser.Utils.Array.GetRandom(COLORS.balloonColors);
                    const bx = Phaser.Math.Between(50, width - 50);
                    const by = Phaser.Math.Between(100, height - 100);
                    Icons.drawBalloon(balloonGfx, 0, 0, Phaser.Math.Between(25, 40), color);
                    balloonGfx.setPosition(bx, by);
                    balloonGfx.setAlpha(0.5);
                    this.tweens.add({
                        targets: balloonGfx, y: by - 30, duration: 2000 + Math.random() * 1000,
                        yoyo: true, repeat: -1, ease: 'Sine.easeInOut'
                    });
                }

                // Title
                const title = this.add.text(width / 2, height / 2 - 80, '구구단 풍선 터트리기', TEXT_STYLES.title).setOrigin(0.5).setScale(0);
                this.tweens.add({ targets: title, scale: 1, duration: 800, ease: 'Back.easeOut' });

                // Subtitle
                const subtitle = this.add.text(width / 2, height / 2 - 20, 'Multiplication Balloon Pop', TEXT_STYLES.subtitle).setOrigin(0.5).setAlpha(0);
                this.tweens.add({ targets: subtitle, alpha: 1, delay: 500, duration: 500 });

                // Question
                const question = this.add.text(width / 2, height / 2 + 50, '3 x 4 = ? 정답 풍선을 찾을 수 있을까요?', { ...TEXT_STYLES.body, fontSize: '26px' }).setOrigin(0.5).setAlpha(0);
                this.tweens.add({ targets: question, alpha: 1, delay: 1000, duration: 500 });

                // Start button
                this.time.delayedCall(1500, () => {
                    this.createButton(width / 2, height / 2 + 150, '시작하기', () => this.scene.start('AnchorScene'));
                });
            }

            createButton(x, y, text, onClick) {
                const container = this.add.container(x, y);
                const bg = this.add.graphics();
                bg.fillStyle(COLORS.pink, 1);
                bg.fillRoundedRect(-100, -28, 200, 56, 12);
                const label = this.add.text(0, 0, text, TEXT_STYLES.button).setOrigin(0.5);
                container.add([bg, label]);
                container.setSize(200, 56).setInteractive({ useHandCursor: true });
                container.on('pointerover', () => { bg.clear(); bg.fillStyle(COLORS.accent, 1); bg.fillRoundedRect(-100, -28, 200, 56, 12); this.tweens.add({ targets: container, scale: 1.05, duration: 100 }); });
                container.on('pointerout', () => { bg.clear(); bg.fillStyle(COLORS.pink, 1); bg.fillRoundedRect(-100, -28, 200, 56, 12); this.tweens.add({ targets: container, scale: 1, duration: 100 }); });
                container.on('pointerdown', onClick);
                return container;
            }
        }

        // ===== ANCHOR SCENE =====
        class AnchorScene extends Phaser.Scene {
            constructor() { super('AnchorScene'); }

            create() {
                const { width, height } = this.cameras.main;
                this.add.rectangle(0, 0, width, height, COLORS.bgPrimary).setOrigin(0);

                const bookIcon = this.add.graphics();
                Icons.drawBook(bookIcon, width / 2 - 140, 60, 40);
                this.add.text(width / 2, 60, '구구단이란?', TEXT_STYLES.title).setOrigin(0.5);

                const content = [
                    '구구단은 곱셈을 빠르게 계산하기 위한 표예요!',
                    '',
                    '예를 들어:',
                    '  2 x 3 = 6  (2가 3번 있으면 6)',
                    '  4 x 5 = 20 (4가 5번 있으면 20)',
                    '',
                    '구구단을 외우면 계산이 빨라져요!'
                ];

                let y = 140;
                content.forEach((line, i) => {
                    const text = this.add.text(width / 2, y, line, TEXT_STYLES.body).setOrigin(0.5).setAlpha(0);
                    this.tweens.add({ targets: text, alpha: 1, delay: i * 200, duration: 400 });
                    y += 42;
                });

                // Visual multiplication example
                const exampleY = 440;
                const exampleGroup = this.add.graphics();

                // Draw 3 groups of 4 dots
                const dotColors = [COLORS.pink, COLORS.cyan, COLORS.lime];
                for (let g = 0; g < 3; g++) {
                    for (let d = 0; d < 4; d++) {
                        exampleGroup.fillStyle(dotColors[g], 1);
                        exampleGroup.fillCircle(width / 2 - 100 + g * 80 + (d % 2) * 25, exampleY + Math.floor(d / 2) * 25, 10);
                    }
                }
                exampleGroup.setAlpha(0);
                this.tweens.add({ targets: exampleGroup, alpha: 1, delay: 1400, duration: 500 });

                this.add.text(width / 2, exampleY + 70, '3 x 4 = 12 (3묶음 x 4개 = 12개)', { fontFamily: 'Noto Sans KR', fontSize: '18px', color: '#fbbf24' }).setOrigin(0.5).setAlpha(0);
                this.tweens.add({ targets: this.children.list[this.children.list.length - 1], alpha: 1, delay: 1600, duration: 400 });

                this.time.delayedCall(2000, () => this.createButton(width / 2, 560, '다음', () => this.scene.start('StoryScene')));
            }

            createButton(x, y, text, onClick) {
                const container = this.add.container(x, y);
                const bg = this.add.graphics();
                bg.fillStyle(COLORS.primary, 1);
                bg.fillRoundedRect(-80, -25, 160, 50, 12);
                const label = this.add.text(0, 0, text, TEXT_STYLES.button).setOrigin(0.5);
                container.add([bg, label]).setSize(160, 50).setInteractive({ useHandCursor: true });
                container.on('pointerover', () => { bg.clear(); bg.fillStyle(COLORS.secondary, 1); bg.fillRoundedRect(-80, -25, 160, 50, 12); });
                container.on('pointerout', () => { bg.clear(); bg.fillStyle(COLORS.primary, 1); bg.fillRoundedRect(-80, -25, 160, 50, 12); });
                container.on('pointerdown', onClick);
            }
        }

        // ===== STORY SCENE =====
        class StoryScene extends Phaser.Scene {
            constructor() { super('StoryScene'); }

            create() {
                const { width, height } = this.cameras.main;
                this.add.rectangle(0, 0, width, height, COLORS.bgPrimary).setOrigin(0);

                // Robot
                const robotGfx = this.add.graphics();
                Icons.drawRobot(robotGfx, 150, height / 2 - 30, 100);
                this.tweens.add({ targets: robotGfx, y: robotGfx.y - 15, duration: 1500, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });

                // Speech bubble
                const bubble = this.add.graphics();
                bubble.fillStyle(0xffffff, 0.95);
                bubble.fillRoundedRect(250, 120, 500, 340, 20);
                bubble.fillTriangle(280, 290, 230, 340, 280, 340);

                // Story text
                const story = [
                    '안녕! 나는 멀티(Multi)야!',
                    '',
                    '오늘 구구단 풍선 축제가 열렸어.',
                    '',
                    '하늘에 뜬 풍선들 중에서',
                    '정답 풍선을 터트려야 해!',
                    '',
                    '틀리면 하트를 잃어버리니까 조심해!'
                ];

                let textY = 150;
                const textObjects = [];
                story.forEach((line) => {
                    const text = this.add.text(280, textY, '', { fontFamily: 'Noto Sans KR', fontSize: '22px', color: '#1e293b', wordWrap: { width: 460 } });
                    textObjects.push({ text, fullText: line, charIndex: 0 });
                    textY += line ? 36 : 18;
                });

                // Typewriter
                let currentLine = 0;
                const typeTimer = this.time.addEvent({
                    delay: 40,
                    callback: () => {
                        if (currentLine >= textObjects.length) { typeTimer.remove(); return; }
                        const obj = textObjects[currentLine];
                        if (obj.charIndex < obj.fullText.length) {
                            obj.text.setText(obj.fullText.substring(0, ++obj.charIndex));
                        } else { currentLine++; }
                    },
                    loop: true
                });

                // Start button
                this.time.delayedCall(3000, () => {
                    const container = this.add.container(width / 2 + 100, 510);
                    const bg = this.add.graphics();
                    bg.fillStyle(COLORS.success, 1);
                    bg.fillRoundedRect(-90, -28, 180, 56, 12);
                    const playIcon = this.add.graphics();
                    Icons.drawPlay(playIcon, -55, 0, 20);
                    const label = this.add.text(0, 0, '게임 시작', TEXT_STYLES.button).setOrigin(0, 0.5);
                    container.add([bg, playIcon, label]).setSize(180, 56).setInteractive({ useHandCursor: true });
                    container.on('pointerover', () => { bg.clear(); bg.fillStyle(0x4ade80, 1); bg.fillRoundedRect(-90, -28, 180, 56, 12); });
                    container.on('pointerout', () => { bg.clear(); bg.fillStyle(COLORS.success, 1); bg.fillRoundedRect(-90, -28, 180, 56, 12); });
                    container.on('pointerdown', () => {
                        this.registry.set('score', 0);
                        this.registry.set('lives', 3);
                        this.registry.set('round', 0);
                        this.scene.start('CoreScene');
                    });
                });
            }
        }

        // ===== CORE SCENE (Main Game) =====
        class CoreScene extends Phaser.Scene {
            constructor() {
                super('CoreScene');
            }

            create() {
                const { width, height } = this.cameras.main;
                this.add.rectangle(0, 0, width, height, COLORS.bgPrimary).setOrigin(0);

                const round = this.registry.get('round') || 0;
                const roundData = GAME_DATA.rounds[round];

                // Round indicator
                this.add.text(width / 2, 25, `라운드 ${round + 1} - ${roundData.name}`, { ...TEXT_STYLES.subtitle, fontSize: '18px', color: '#' + roundData.color.toString(16).padStart(6, '0') }).setOrigin(0.5);

                // Lives display
                this.livesContainer = this.add.container(80, 25);
                this.updateLivesDisplay();

                // Score display
                this.createScoreDisplay(width - 80, 25);

                // Problem counter
                this.problemIndex = 0;
                this.problemCount = GAME_DATA.problemsPerRound;
                this.problemText = this.add.text(width / 2, 100, '', TEXT_STYLES.problem).setOrigin(0.5);
                this.progressText = this.add.text(width / 2, 150, '', { fontFamily: 'Noto Sans KR', fontSize: '16px', color: '#64748b' }).setOrigin(0.5);

                // Balloon area
                this.balloons = [];
                this.balloonsContainer = this.add.container(0, 0);

                // Feedback area
                this.feedbackText = this.add.text(width / 2, height - 50, '', { fontFamily: 'Noto Sans KR', fontSize: '24px', color: '#22c55e' }).setOrigin(0.5);

                // Start first problem
                this.showProblem();
            }

            updateLivesDisplay() {
                this.livesContainer.removeAll(true);
                const lives = this.registry.get('lives') || 3;
                for (let i = 0; i < 3; i++) {
                    const heartGfx = this.add.graphics();
                    if (i < lives) {
                        Icons.drawHeart(heartGfx, i * 35, 0, 20, COLORS.pink);
                    } else {
                        Icons.drawHeart(heartGfx, i * 35, 0, 20, 0x475569);
                    }
                    this.livesContainer.add(heartGfx);
                }
            }

            createScoreDisplay(x, y) {
                const container = this.add.container(x, y);
                const bg = this.add.graphics();
                bg.fillStyle(COLORS.bgCard, 0.8);
                bg.fillRoundedRect(-55, -18, 110, 36, 8);
                const starIcon = this.add.graphics();
                Icons.drawStar(starIcon, -32, 0, 12, COLORS.gold);
                this.scoreText = this.add.text(5, 0, (this.registry.get('score') || 0).toString(), { fontFamily: 'Noto Sans KR', fontSize: '22px', color: '#fbbf24', fontStyle: 'bold' }).setOrigin(0, 0.5);
                container.add([bg, starIcon, this.scoreText]);
            }

            showProblem() {
                const { width, height } = this.cameras.main;
                const round = this.registry.get('round') || 0;
                const roundData = GAME_DATA.rounds[round];

                // Clear previous balloons
                this.balloons.forEach(b => b.destroy());
                this.balloons = [];
                this.feedbackText.setText('');

                // Generate problem
                this.currentProblem = generateProblem(roundData.tables);
                this.problemText.setText(`${this.currentProblem.a} x ${this.currentProblem.b} = ?`);
                this.progressText.setText(`문제 ${this.problemIndex + 1} / ${this.problemCount}`);

                // Generate answers (1 correct + 3 wrong)
                const wrongAnswers = generateWrongAnswers(this.currentProblem.answer, 3);
                const allAnswers = Phaser.Utils.Array.Shuffle([this.currentProblem.answer, ...wrongAnswers]);

                // Create balloons
                const balloonY = 450;
                const spacing = 150;
                const startX = (width - (allAnswers.length - 1) * spacing) / 2;

                allAnswers.forEach((answer, i) => {
                    const x = startX + i * spacing;
                    const y = balloonY + Phaser.Math.Between(-20, 20);
                    const balloon = this.createBalloon(x, y, answer);
                    this.balloons.push(balloon);

                    // Float animation
                    this.tweens.add({
                        targets: balloon,
                        y: y - 15,
                        duration: 1500 + Math.random() * 500,
                        yoyo: true,
                        repeat: -1,
                        ease: 'Sine.easeInOut'
                    });
                });
            }

            createBalloon(x, y, number) {
                const container = this.add.container(x, y + 100); // Start below screen
                const color = Phaser.Utils.Array.GetRandom(COLORS.balloonColors);
                const radius = 50;

                // Balloon graphics
                const balloonGfx = this.add.graphics();
                Icons.drawBalloon(balloonGfx, 0, 0, radius, color);

                // Number text
                const numText = this.add.text(0, -5, number.toString(), TEXT_STYLES.balloonNum).setOrigin(0.5);

                container.add([balloonGfx, numText]);
                container.setSize(radius * 2, radius * 2 + 80);
                container.setInteractive({ useHandCursor: true });
                container.answer = number;
                container.balloonGfx = balloonGfx;
                container.numText = numText;
                container.color = color;

                // Entrance animation
                this.tweens.add({
                    targets: container,
                    y: y,
                    duration: 500,
                    ease: 'Back.easeOut'
                });

                // Hover effect
                container.on('pointerover', () => {
                    this.tweens.add({ targets: container, scale: 1.1, duration: 100 });
                });
                container.on('pointerout', () => {
                    this.tweens.add({ targets: container, scale: 1, duration: 100 });
                });

                // Click handler
                container.on('pointerdown', () => this.popBalloon(container));

                return container;
            }

            popBalloon(balloon) {
                const isCorrect = balloon.answer === this.currentProblem.answer;

                // Disable all balloons
                this.balloons.forEach(b => b.disableInteractive());

                if (isCorrect) {
                    this.handleCorrect(balloon);
                } else {
                    this.handleWrong(balloon);
                }
            }

            handleCorrect(balloon) {
                // Pop animation
                this.tweens.add({
                    targets: balloon,
                    scale: 1.5,
                    alpha: 0,
                    duration: 300,
                    onComplete: () => balloon.destroy()
                });

                // Particles
                this.showPopEffect(balloon.x, balloon.y, balloon.color);

                // Update score
                const newScore = (this.registry.get('score') || 0) + 10;
                this.registry.set('score', newScore);
                this.scoreText.setText(newScore.toString());
                this.tweens.add({ targets: this.scoreText, scale: 1.3, duration: 100, yoyo: true });

                // Feedback
                this.feedbackText.setText('정답!').setColor('#22c55e');
                this.showScorePopup(balloon.x, balloon.y - 50, 10);

                // Next problem or round
                this.time.delayedCall(1000, () => {
                    this.problemIndex++;
                    if (this.problemIndex >= this.problemCount) {
                        this.roundComplete();
                    } else {
                        this.showProblem();
                    }
                });
            }

            handleWrong(balloon) {
                // Shake animation
                this.tweens.add({
                    targets: balloon,
                    x: balloon.x + 8,
                    duration: 50,
                    yoyo: true,
                    repeat: 4,
                    ease: 'Sine.easeInOut'
                });

                // Lose a life
                let lives = this.registry.get('lives') || 3;
                lives--;
                this.registry.set('lives', lives);
                this.updateLivesDisplay();

                // Show correct answer
                this.feedbackText.setText(`틀렸어요! 정답은 ${this.currentProblem.answer}`).setColor('#ef4444');

                // Error mark
                const errorMark = this.add.graphics();
                errorMark.lineStyle(4, COLORS.error, 1);
                errorMark.lineBetween(-10, -10, 10, 10);
                errorMark.lineBetween(-10, 10, 10, -10);
                errorMark.setPosition(balloon.x, balloon.y - 70);
                this.tweens.add({ targets: errorMark, y: errorMark.y - 30, alpha: 0, duration: 800, onComplete: () => errorMark.destroy() });

                // Check game over
                if (lives <= 0) {
                    this.time.delayedCall(1500, () => this.gameOver());
                } else {
                    // Re-enable correct balloon
                    this.time.delayedCall(1500, () => {
                        this.balloons.forEach(b => {
                            if (b.answer === this.currentProblem.answer) {
                                b.setInteractive({ useHandCursor: true });
                                // Highlight correct one
                                this.tweens.add({ targets: b, scale: 1.2, duration: 200, yoyo: true, repeat: 2 });
                            }
                        });
                    });
                }
            }

            showPopEffect(x, y, color) {
                for (let i = 0; i < 12; i++) {
                    const particle = this.add.graphics();
                    particle.fillStyle(color, 1);
                    particle.fillCircle(0, 0, Phaser.Math.Between(4, 10));
                    particle.setPosition(x, y);
                    this.tweens.add({
                        targets: particle,
                        x: x + Phaser.Math.Between(-100, 100),
                        y: y + Phaser.Math.Between(-100, 100),
                        alpha: 0,
                        scale: 0,
                        duration: 600,
                        onComplete: () => particle.destroy()
                    });
                }
            }

            showScorePopup(x, y, points) {
                const popup = this.add.text(x, y, `+${points}`, { fontFamily: 'Noto Sans KR', fontSize: '26px', color: '#fbbf24', fontStyle: 'bold' }).setOrigin(0.5);
                this.tweens.add({ targets: popup, y: y - 50, alpha: 0, duration: 800, ease: 'Cubic.easeOut', onComplete: () => popup.destroy() });
            }

            roundComplete() {
                const round = this.registry.get('round') || 0;
                if (round < GAME_DATA.rounds.length - 1) {
                    this.registry.set('round', round + 1);
                    this.scene.restart();
                } else {
                    this.scene.start('VisualizeScene');
                }
            }

            gameOver() {
                this.scene.start('WrapScene', { gameOver: true });
            }
        }

        // ===== VISUALIZE SCENE =====
        class VisualizeScene extends Phaser.Scene {
            constructor() { super('VisualizeScene'); }

            create() {
                const { width, height } = this.cameras.main;
                this.add.rectangle(0, 0, width, height, COLORS.bgPrimary).setOrigin(0);

                this.add.text(width / 2, 50, '구구단 정리', TEXT_STYLES.title).setOrigin(0.5);

                // Show multiplication tables
                const tables = [
                    { n: 2, color: COLORS.cyan },
                    { n: 5, color: COLORS.lime },
                    { n: 7, color: COLORS.orange },
                    { n: 9, color: COLORS.pink }
                ];

                const boxWidth = 160;
                const startX = (width - (tables.length * boxWidth + 60)) / 2;

                tables.forEach((table, i) => {
                    const x = startX + i * (boxWidth + 20) + boxWidth / 2;
                    const y = 170;

                    const box = this.add.graphics();
                    box.fillStyle(table.color, 0.15);
                    box.fillRoundedRect(x - boxWidth / 2, y - 30, boxWidth, 310, 12);
                    box.lineStyle(2, table.color, 0.8);
                    box.strokeRoundedRect(x - boxWidth / 2, y - 30, boxWidth, 310, 12);

                    this.add.text(x, y - 5, `${table.n}단`, { fontFamily: 'Noto Sans KR', fontSize: '22px', color: '#ffffff', fontStyle: 'bold' }).setOrigin(0.5);

                    for (let j = 1; j <= 9; j++) {
                        this.add.text(x, y + 25 + j * 28, `${table.n} x ${j} = ${table.n * j}`, { fontFamily: 'Noto Sans KR', fontSize: '16px', color: '#e2e8f0' }).setOrigin(0.5);
                    }
                });

                this.add.text(width / 2, 510, '구구단을 많이 연습하면 암산이 빨라져요!', { fontFamily: 'Noto Sans KR', fontSize: '18px', color: '#fbbf24' }).setOrigin(0.5);

                this.createButton(width / 2, 560, '퀴즈 풀기', () => this.scene.start('QuizScene'));
            }

            createButton(x, y, text, onClick) {
                const container = this.add.container(x, y);
                const bg = this.add.graphics();
                bg.fillStyle(COLORS.primary, 1);
                bg.fillRoundedRect(-80, -25, 160, 50, 12);
                container.add([bg, this.add.text(0, 0, text, TEXT_STYLES.button).setOrigin(0.5)]).setSize(160, 50).setInteractive({ useHandCursor: true });
                container.on('pointerover', () => { bg.clear(); bg.fillStyle(COLORS.secondary, 1); bg.fillRoundedRect(-80, -25, 160, 50, 12); });
                container.on('pointerout', () => { bg.clear(); bg.fillStyle(COLORS.primary, 1); bg.fillRoundedRect(-80, -25, 160, 50, 12); });
                container.on('pointerdown', onClick);
            }
        }

        // ===== QUIZ SCENE =====
        class QuizScene extends Phaser.Scene {
            constructor() {
                super('QuizScene');
                this.quizData = [
                    { q: '3 x 4 = ?', a: 12, options: [10, 12, 14, 16] },
                    { q: '6 x 7 = ?', a: 42, options: [36, 42, 48, 49] },
                    { q: '8 x 5 = ?', a: 40, options: [35, 40, 45, 48] },
                    { q: '9 x 9 = ?', a: 81, options: [72, 79, 81, 90] },
                    { q: '7 x 8 = ?', a: 56, options: [48, 54, 56, 63] }
                ];
                this.currentQuestion = 0;
                this.quizScore = 0;
            }

            create() {
                const { width, height } = this.cameras.main;
                this.add.rectangle(0, 0, width, height, COLORS.bgPrimary).setOrigin(0);
                this.add.text(width / 2, 40, '퀴즈 타임', TEXT_STYLES.title).setOrigin(0.5);
                this.questionText = this.add.text(width / 2, 130, '', { ...TEXT_STYLES.body, fontSize: '36px' }).setOrigin(0.5);
                this.optionButtons = [];
                this.feedbackText = this.add.text(width / 2, 440, '', { fontFamily: 'Noto Sans KR', fontSize: '22px', color: '#fbbf24' }).setOrigin(0.5);
                this.progressText = this.add.text(width / 2, 510, '', { fontFamily: 'Noto Sans KR', fontSize: '16px', color: '#64748b' }).setOrigin(0.5);
                this.showQuestion();
            }

            showQuestion() {
                const { width } = this.cameras.main;
                const q = this.quizData[this.currentQuestion];
                this.questionText.setText(q.q);
                this.feedbackText.setText('');
                this.progressText.setText(`문제 ${this.currentQuestion + 1} / ${this.quizData.length}`);
                this.optionButtons.forEach(b => b.destroy());
                this.optionButtons = [];

                // 2x2 grid of options
                q.options.forEach((opt, i) => {
                    const col = i % 2;
                    const row = Math.floor(i / 2);
                    const x = width / 2 - 85 + col * 170;
                    const y = 220 + row * 90;

                    const container = this.add.container(x, y);
                    const bg = this.add.graphics();
                    bg.fillStyle(COLORS.bgCard, 1);
                    bg.fillRoundedRect(-70, -35, 140, 70, 12);
                    container.add([bg, this.add.text(0, 0, opt.toString(), { fontFamily: 'Noto Sans KR', fontSize: '28px', color: '#ffffff', fontStyle: 'bold' }).setOrigin(0.5)]);
                    container.setSize(140, 70).setInteractive({ useHandCursor: true });
                    container.answer = opt;
                    container.bg = bg;
                    container.on('pointerover', () => { bg.clear(); bg.fillStyle(COLORS.primary, 0.5); bg.fillRoundedRect(-70, -35, 140, 70, 12); });
                    container.on('pointerout', () => { bg.clear(); bg.fillStyle(COLORS.bgCard, 1); bg.fillRoundedRect(-70, -35, 140, 70, 12); });
                    container.on('pointerdown', () => this.checkAnswer(container, q.a));
                    this.optionButtons.push(container);
                });
            }

            checkAnswer(btn, correctAnswer) {
                const isCorrect = btn.answer === correctAnswer;
                this.optionButtons.forEach(b => b.disableInteractive());

                if (isCorrect) {
                    btn.bg.clear(); btn.bg.fillStyle(COLORS.success, 1); btn.bg.fillRoundedRect(-70, -35, 140, 70, 12);
                    this.feedbackText.setText('정답!').setColor('#22c55e');
                    this.quizScore++;
                    this.registry.set('score', (this.registry.get('score') || 0) + 20);
                } else {
                    btn.bg.clear(); btn.bg.fillStyle(COLORS.error, 1); btn.bg.fillRoundedRect(-70, -35, 140, 70, 12);
                    this.feedbackText.setText(`아쉬워요! 정답은 ${correctAnswer}`).setColor('#ef4444');
                    // Highlight correct
                    this.optionButtons.forEach(b => {
                        if (b.answer === correctAnswer) {
                            b.bg.clear(); b.bg.fillStyle(COLORS.success, 1); b.bg.fillRoundedRect(-70, -35, 140, 70, 12);
                        }
                    });
                }

                this.time.delayedCall(1500, () => {
                    this.currentQuestion++;
                    if (this.currentQuestion < this.quizData.length) this.showQuestion();
                    else { this.registry.set('quizScore', this.quizScore); this.scene.start('WrapScene'); }
                });
            }
        }

        // ===== WRAP SCENE =====
        class WrapScene extends Phaser.Scene {
            constructor() { super('WrapScene'); }

            init(data) {
                this.gameOver = data?.gameOver || false;
            }

            create() {
                const { width, height } = this.cameras.main;
                this.add.rectangle(0, 0, width, height, COLORS.bgPrimary).setOrigin(0);

                if (this.gameOver) {
                    this.showGameOver(width, height);
                } else {
                    this.showVictory(width, height);
                }
            }

            showVictory(width, height) {
                // Confetti
                for (let i = 0; i < 30; i++) {
                    const confetti = this.add.graphics();
                    confetti.fillStyle(Phaser.Utils.Array.GetRandom(COLORS.balloonColors), 1);
                    confetti.fillRect(0, 0, Phaser.Math.Between(6, 14), Phaser.Math.Between(6, 14));
                    confetti.setPosition(Phaser.Math.Between(0, width), -20);
                    this.tweens.add({ targets: confetti, y: height + 50, x: confetti.x + Phaser.Math.Between(-100, 100), angle: Phaser.Math.Between(180, 720), duration: Phaser.Math.Between(2000, 4000), delay: i * 100, repeat: -1 });
                }

                // Trophy
                const trophyGfx = this.add.graphics();
                Icons.drawTrophy(trophyGfx, width / 2, 100, 60);
                this.tweens.add({ targets: trophyGfx, scale: 1.15, duration: 500, yoyo: true, repeat: -1 });

                this.add.text(width / 2, 190, '축하해요!', { ...TEXT_STYLES.title, fontSize: '46px' }).setOrigin(0.5);
                this.add.text(width / 2, 240, '구구단 게임을 완료했어요!', TEXT_STYLES.subtitle).setOrigin(0.5);

                // Score box
                const scoreBox = this.add.graphics();
                scoreBox.fillStyle(COLORS.bgSecondary, 1);
                scoreBox.fillRoundedRect(width / 2 - 140, 280, 280, 100, 12);
                scoreBox.lineStyle(2, COLORS.pink, 1);
                scoreBox.strokeRoundedRect(width / 2 - 140, 280, 280, 100, 12);
                this.add.text(width / 2, 310, '최종 점수', { fontFamily: 'Noto Sans KR', fontSize: '18px', color: '#94a3b8' }).setOrigin(0.5);

                const starIcon = this.add.graphics();
                Icons.drawStar(starIcon, width / 2 - 55, 355, 16, COLORS.gold);
                this.add.text(width / 2 + 5, 355, `${this.registry.get('score') || 0}점`, { fontFamily: 'Noto Sans KR', fontSize: '36px', color: '#fbbf24', fontStyle: 'bold' }).setOrigin(0, 0.5);

                // Summary
                ['오늘 배운 것:', '2~9단 구구단 복습', '곱셈은 같은 수를 여러 번 더하는 것!', '구구단을 외우면 계산이 빨라져요!'].forEach((line, i) => {
                    this.add.text(width / 2, 410 + i * 26, line, { fontFamily: 'Noto Sans KR', fontSize: '16px', color: i === 0 ? '#ffffff' : '#94a3b8' }).setOrigin(0.5);
                });

                this.createRestartButton(width, height);
            }

            showGameOver(width, height) {
                this.add.text(width / 2, 150, '게임 오버', { ...TEXT_STYLES.title, fontSize: '46px', color: '#ef4444' }).setOrigin(0.5);
                this.add.text(width / 2, 210, '하트를 모두 잃었어요!', TEXT_STYLES.subtitle).setOrigin(0.5);

                // Score box
                const scoreBox = this.add.graphics();
                scoreBox.fillStyle(COLORS.bgSecondary, 1);
                scoreBox.fillRoundedRect(width / 2 - 140, 280, 280, 100, 12);
                scoreBox.lineStyle(2, COLORS.error, 1);
                scoreBox.strokeRoundedRect(width / 2 - 140, 280, 280, 100, 12);
                this.add.text(width / 2, 310, '획득 점수', { fontFamily: 'Noto Sans KR', fontSize: '18px', color: '#94a3b8' }).setOrigin(0.5);

                const starIcon = this.add.graphics();
                Icons.drawStar(starIcon, width / 2 - 55, 355, 16, COLORS.gold);
                this.add.text(width / 2 + 5, 355, `${this.registry.get('score') || 0}점`, { fontFamily: 'Noto Sans KR', fontSize: '36px', color: '#fbbf24', fontStyle: 'bold' }).setOrigin(0, 0.5);

                this.add.text(width / 2, 430, '다시 도전해보세요!', { fontFamily: 'Noto Sans KR', fontSize: '20px', color: '#94a3b8' }).setOrigin(0.5);

                this.createRestartButton(width, height);
            }

            createRestartButton(width, height) {
                const btn = this.add.container(width / 2, 520);
                const btnBg = this.add.graphics();
                btnBg.fillStyle(COLORS.success, 1);
                btnBg.fillRoundedRect(-90, -26, 180, 52, 12);
                const refreshIcon = this.add.graphics();
                Icons.drawRefresh(refreshIcon, -55, 0, 18);
                btn.add([btnBg, refreshIcon, this.add.text(0, 0, '다시 하기', TEXT_STYLES.button).setOrigin(0, 0.5)]).setSize(180, 52).setInteractive({ useHandCursor: true });
                btn.on('pointerover', () => { btnBg.clear(); btnBg.fillStyle(0x4ade80, 1); btnBg.fillRoundedRect(-90, -26, 180, 52, 12); });
                btn.on('pointerout', () => { btnBg.clear(); btnBg.fillStyle(COLORS.success, 1); btnBg.fillRoundedRect(-90, -26, 180, 52, 12); });
                btn.on('pointerdown', () => {
                    this.registry.set('score', 0);
                    this.registry.set('lives', 3);
                    this.registry.set('round', 0);
                    this.scene.start('HookScene');
                });
            }
        }

        // ===== GAME CONFIG =====
        const config = {
            type: Phaser.AUTO,
            width: 800,
            height: 600,
            parent: 'game-container',
            backgroundColor: COLORS.bgPrimary,
            scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
            scene: [HookScene, AnchorScene, StoryScene, CoreScene, VisualizeScene, QuizScene, WrapScene]
        };

        const game = new Phaser.Game(config);
    </script>
</body>
</html>
